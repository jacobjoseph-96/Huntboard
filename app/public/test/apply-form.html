<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practice application form</title>
  <style>
    body { font: 15px/1.5 "Segoe UI", Arial, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; color: #1f2328; background: #fff; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
    .hp { position: absolute; left: -9999px; }
    button { margin-top: 18px; padding: 10px 18px; font: inherit; font-weight: 700; background: #0f766e; color: #fff; border: 0; border-radius: 6px; }
    .note { background: #fef3c7; padding: 8px 12px; border-radius: 6px; }
    #done { display: none; background: #e7f6ec; padding: 14px; border-radius: 6px; }
  </style>
</head>
<body>
  <p class="note">Huntboard practice form: nothing is sent anywhere. Use it to see how the AI fills in applications.</p>
  <h1>Apply: Waiter (part-time) at Hotel Example</h1>
  <form id="f">
    <label for="first">First name *</label><input id="first" name="first_name" required>
    <label for="last">Last name *</label><input id="last" name="last_name" required>
    <label for="email">E-mail *</label><input id="email" name="email" type="email" required>
    <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
    <label for="start">Earliest start date *</label><input id="start" name="start" required>
    <label for="permit">Do you have the right to work in this country? *</label>
    <select id="permit" name="permit" required><option value="">Choose…</option><option>Yes</option><option>No, I need a visa</option></select>
    <label for="cv">CV (PDF) *</label><input id="cv" name="cv" type="file" accept=".pdf" required>
    <label for="motivation">Why do you want this job?</label><textarea id="motivation" name="motivation" rows="4"></textarea>
    <div class="hp"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <button type="submit">Submit application</button>
  </form>
  <div id="done"><b>Thank you!</b> Your application (practice) was received. Reference: PRACTICE-<span id="ref"></span></div>
  <script src="apply-form.js"></script>
</body>
</html>
